services:
  devinvestigator:
    build: .
    image: devinvestigator:dev
    container_name: devinvestigator
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: json
    ports:
      # 8000, 8010, 8011 and 8080 are used by other services on this host.
      - "${DEVINVESTIGATOR_PORT:-8012}:8000"
    volumes:
      # Investigations database (SQLite). Survives container rebuilds.
      - devinvestigator_data:/app/data
    networks:
      - devinvestigator_net
    extra_hosts:
      # Lets the container reach Ollama on the host at http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional local AI, for servers with a GPU. Not started by a plain `docker compose up -d`:
  #   docker compose --profile local-ai up -d
  #   docker compose --profile local-ai exec ollama ollama pull <model>
  # then set OLLAMA_BASE_URL=http://ollama:11434 in .env and `docker compose up -d`.
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: devinvestigator_ollama
    volumes:
      - devinvestigator_ollama:/root/.ollama
    networks:
      - devinvestigator_net
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
    deploy:
      resources:
        reservations:
          devices:
            # One GPU, chosen with DEVINVESTIGATOR_GPU (index or UUID).
            - driver: nvidia
              device_ids: ["${DEVINVESTIGATOR_GPU:-0}"]
              capabilities: ["gpu"]
    restart: unless-stopped

networks:
  devinvestigator_net:
    name: devinvestigator_net
    driver: bridge
    ipam:
      config:
        # Docker's automatic address pools are exhausted on this host, so the subnet is
        # explicit. 10.211.11.0/24 does not overlap any existing Docker network or host route.
        - subnet: ${DEVINVESTIGATOR_SUBNET:-10.211.11.0/24}

volumes:
  devinvestigator_data:
    name: devinvestigator_data
  devinvestigator_ollama:
    name: devinvestigator_ollama
